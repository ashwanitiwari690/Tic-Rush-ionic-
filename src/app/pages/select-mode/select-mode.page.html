
<main class="page select-mode">
  <div class="topbar">
    <button class="icon-btn" aria-label="Back" [disabled]="navigating" (click)="back()"><app-icon name="arrow-back"></app-icon></button>
    <div class="title">SELECT MODE</div>
    <span></span>
  </div>

  <section class="hero card">
    <div class="hero-title"><span class="pulse-dot"></span><span>CHOOSE YOUR BATTLE</span></div>
    <h2>Ready for a quick win?</h2>
    <p>Beat the computer to earn <b>10 coins</b> and level up. Play together with a friend for free.</p>

    <div class="mode-grid">
      <button class="mode computer" [disabled]="navigating" (click)="go('computer')">
        <div class="mode-top"><div class="mode-icon"><app-icon name="hardware-chip-outline"></app-icon></div><span class="reward">+10 🪙</span></div>
        <strong>VS COMPUTER</strong><small>Challenge the AI • Coins on wins</small>
        <span class="play-label">CHOOSE BOARD <app-icon name="arrow-forward-circle"></app-icon></span>
      </button>

      <button class="mode team" [disabled]="navigating" (click)="go('team')">
        <div class="mode-top"><div class="mode-icon"><app-icon name="people-outline"></app-icon></div><span class="reward free">FREE</span></div>
        <strong>2 PLAYER TEAM</strong><small>Pass & play • No coins</small>
        <span class="play-label">CHOOSE BOARD <app-icon name="arrow-forward-circle"></app-icon></span>
      </button>
    </div>

    <button class="mode survival" [disabled]="navigating" (click)="go('survival')">
      <div class="mode-top">
        <div class="mode-icon"><app-icon name="flame"></app-icon></div>
        <span class="streak-pill">STREAK: {{game.survivalStreak}}</span>
      </div>
      <strong>SURVIVAL LADDER</strong>
      <small>Win streak vs the AI • Board gets harder as you climb • One loss ends it</small>
      <span class="play-label">START RUN <app-icon name="arrow-forward-circle"></app-icon></span>
    </button>
  </section>
</main>
