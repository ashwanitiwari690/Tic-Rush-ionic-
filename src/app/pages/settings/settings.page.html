<ion-content [fullscreen]="true"><main class="page settings"><div class="topbar"><button class="icon-btn" [disabled]="navigating" (click)="back()"><ion-icon name="arrow-back"></ion-icon></button><div class="title">SETTINGS</div><span></span></div><section class="section"><label>AUDIO</label><div class="card setting-list"><div class="setting"><ion-icon name="volume-high"></ion-icon><div><strong>Sound Effects</strong><small>Tap, win and game feedback</small></div><ion-toggle [checked]="audio.sound" (ionChange)="audio.setSound($event.detail.checked)"></ion-toggle></div><div class="setting"><ion-icon name="musical-notes"></ion-icon><div><strong>Music</strong><small>Light arcade music during play</small></div><ion-toggle [checked]="audio.music" (ionChange)="audio.setMusic($event.detail.checked)"></ion-toggle></div><div class="volume"><div><strong>Music Volume</strong><small>{{(audio.volume*100)|number:'1.0-0'}}%</small></div><ion-range [min]="0" [max]="1" [step]="0.05" [value]="audio.volume" (ionInput)="audio.setVolume($any($event).detail.value)"></ion-range></div></div></section><section class="section"><label>GAMEPLAY</label><div class="card info"><div><strong>Computer Difficulty</strong><small>Smart mode balances challenge and speed.</small></div><div class="difficulty"><button [class.active]="game.difficulty==='easy'" (click)="game.setDifficulty('easy')">Easy</button><button [class.active]="game.difficulty==='smart'" (click)="game.setDifficulty('smart')">Smart</button><button [class.active]="game.difficulty==='master'" (click)="game.setDifficulty('master')">Master</button></div></div></section><section class="section"><label>PROFILE</label><button class="card link-card" [disabled]="navigating" (click)="openProfile()"><ion-icon name="person-circle-outline"></ion-icon><div><strong>Profile & stats</strong><small>Coins, wins and level progress</small></div><span>›</span></button></section></main></ion-content>
